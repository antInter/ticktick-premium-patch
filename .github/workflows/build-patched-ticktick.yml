name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your installed TickTick.exe file (NOT the installer!)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          Write-Host "Downloading target file from ${{ inputs.app_url }}..."
          Invoke-WebRequest -Uri "${{ inputs.app_url }}" -OutFile "TickTick.exe"

          $file = Get-Item "TickTick.exe"
          Write-Host "Downloaded file size: $([math]::Round($file.Length / 1MB, 2)) MB ($($file.Length) bytes)"

          # Check if the download was an HTML error/preview page
          $firstBytes = Get-Content -Path "TickTick.exe" -TotalCount 5 -Raw -ErrorAction SilentlyContinue
          if ($firstBytes -match "<!DOCTYPE html" -or $firstBytes -match "<html") {
            Write-Error "ERROR: The URL provided downloaded an HTML page instead of a direct binary. Make sure you are using a direct download link (Google Drive/Dropbox share links will NOT work)."
            exit 1
          }

          # Check if the file is suspiciously small (real TickTick.exe is usually > 15MB)
          if ($file.Length -lt 5MB) {
            Write-Error "ERROR: The downloaded file is only $([math]::Round($file.Length / 1MB, 2)) MB. A valid installed TickTick.exe is usually much larger. Make sure you uploaded the installed exe from 'Program Files', NOT a shortcut or installer."
            exit 1
          }

      - name: Run Patcher
        shell: pwsh
        run: |
          dotnet run -- "TickTick.exe"
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patcher ran but 'TickTick_Patched.exe' was not created. Check the log output above for dnlib/assembly errors."
            exit 1
          }

      - name: Prepare Release Package
        shell: pwsh
        run: |
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
