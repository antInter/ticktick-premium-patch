name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your installed TickTick.exe file"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          Write-Host "Downloading target file from ${{ inputs.app_url }}..."
          # Use curl with follow-redirects (-L) and silent fail-fast (-f)
          curl.exe -fL -o "TickTick.exe" "${{ inputs.app_url }}"

          $file = Get-Item "TickTick.exe"
          Write-Host "Downloaded file size: $([math]::Round($file.Length / 1MB, 2)) MB ($($file.Length) bytes)"

          # Check if the file is suspiciously small (real TickTick.exe is usually > 15MB)
          if ($file.Length -lt 5MB) {
            Write-Host "--- File Content Preview (You downloaded a webpage!) ---"
            Get-Content -Path "TickTick.exe" -TotalCount 15 -ErrorAction SilentlyContinue
            Write-Host "---------------------------------------------------------"
            Write-Error "ERROR: The file is only $([math]::Round($file.Length / 1MB, 2)) MB. You passed a webpage link instead of the direct file link. Right-click the Download button on Filebin and choose 'Copy Link Address'!"
            exit 1
          }

      - name: Run Patcher
        shell: pwsh
        run: |
          dotnet run -- "TickTick.exe"
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patcher ran but 'TickTick_Patched.exe' was not created. Check the log output above for dnlib/assembly errors."
            exit 1
          }

      - name: Prepare Release Package
        shell: pwsh
        run: |
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
